<style>
/* Layout: cabecera fija + índice lateral + artículo de lectura; el índice es un cajón en móvil */
:root {
  --bg: #f4f6f3;
  --surface: #ffffff;
  --ink: #17201c;
  --muted: #55655e;
  --line: #d9e1dc;
  --accent: #0b6b58;
  --accent-ink: #ffffff;
  --accent-soft: #dcefe8;
  --ok: #1b7443;   --ok-bg: #dff1e6;
  --warn: #8a5a00; --warn-bg: #fbeccd;
  --bad: #a52f28;  --bad-bg: #f8dedb;
  --mute-bg: #e8ece9;
  --code-bg: #101a16;
  --code-bar: #18241f;
  --code-ink: #d6e6de;
  --code-line: #2a3a33;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --header-h: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1411; --surface: #151d19; --ink: #e3ece7; --muted: #94a69d; --line: #26332d;
    --accent: #5fd0b3; --accent-ink: #07130f; --accent-soft: #1a3029;
    --ok: #6fd69a; --ok-bg: #183324; --warn: #f0be5a; --warn-bg: #3a2c0d; --bad: #ff948c; --bad-bg: #3b1a17;
    --mute-bg: #212c27; --code-bg: #0a110e; --code-bar: #121b17; --code-line: #24332c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1411; --surface: #151d19; --ink: #e3ece7; --muted: #94a69d; --line: #26332d;
  --accent: #5fd0b3; --accent-ink: #07130f; --accent-soft: #1a3029;
  --ok: #6fd69a; --ok-bg: #183324; --warn: #f0be5a; --warn-bg: #3a2c0d; --bad: #ff948c; --bad-bg: #3b1a17;
  --mute-bg: #212c27; --code-bg: #0a110e; --code-bar: #121b17; --code-line: #24332c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: auto; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.65;
  min-height: 100%;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 40; background: var(--surface);
}
a { color: var(--accent); text-underline-offset: 2px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* Cabecera */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.top-in {
  height: var(--header-h); display: flex; align-items: center; gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.brand { font-family: var(--font-display); font-weight: 700; font-size: 18px; letter-spacing: -0.01em; white-space: nowrap; }
.brand small { font-family: var(--font-mono); font-weight: 400; font-size: 12px; color: var(--muted); margin-left: 8px; }
.search { position: relative; flex: 1; min-width: 0; max-width: 460px; margin-left: auto; }
.search input {
  width: 100%; height: 36px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--bg); color: var(--ink); padding: 0 12px; font: inherit; font-size: 14px;
}
.btn {
  height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--surface); cursor: pointer; font-size: 14px; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); }
#navbtn { display: none; }
.results {
  position: absolute; top: 42px; left: 0; right: 0; max-height: 60vh; overflow: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  box-shadow: 0 12px 32px rgba(0,0,0,.18); z-index: 50; min-width: min(420px, 92vw);
}
.results a { display: block; padding: 10px 14px; text-decoration: none; color: var(--ink); border-bottom: 1px solid var(--line); }
.results a:last-child { border-bottom: 0; }
.results a:hover { background: var(--accent-soft); }
.results b { display: block; font-size: 14px; }
.results span { display: block; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.results p { margin: 0; padding: 12px 14px; color: var(--muted); font-size: 14px; }

/* Estructura */
.shell {
  display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 0 48px; max-width: 1280px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.nav {
  position: sticky; top: calc(var(--header-h) + env(safe-area-inset-top, 0px));
  height: calc(100vh - var(--header-h) - env(safe-area-inset-top, 0px));
  overflow-y: auto; padding: 24px 8px 40px 0; font-size: 14px; align-self: start;
}
.nav h3 {
  margin: 20px 0 6px; font: 600 11px/1.3 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.nav h3:first-child { margin-top: 0; }
.nav a {
  display: flex; gap: 8px; align-items: baseline; padding: 5px 8px; border-radius: 5px;
  text-decoration: none; color: var(--ink); line-height: 1.35;
}
.nav a:hover { background: var(--accent-soft); }
.nav a.on { background: var(--accent); color: var(--accent-ink); }
.nav a.todo { color: var(--muted); }
.nav a.on.todo { color: var(--accent-ink); }
.nav .code { font: 500 11px var(--font-mono); min-width: 28px; opacity: .75; }
.main { padding: 36px 0 80px; min-width: 0; }
.doc { max-width: 78ch; min-width: 0; }

/* Tipografía del artículo */
.doc h1 { font: 700 clamp(30px, 4.4vw, 44px)/1.08 var(--font-display); letter-spacing: -0.025em; margin: 0 0 18px; text-wrap: balance; }
.doc h2 { font: 700 26px/1.2 var(--font-display); letter-spacing: -0.015em; margin: 48px 0 12px; padding-top: 24px; border-top: 1px solid var(--line); scroll-margin-top: calc(var(--header-h) + 16px); text-wrap: balance; }
.doc h3 { font: 600 19px/1.3 var(--font-display); margin: 30px 0 8px; scroll-margin-top: calc(var(--header-h) + 16px); }
.doc h4 { font: 600 12px/1.3 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 24px 0 6px; }
.doc p, .doc ul, .doc ol { margin: 0 0 14px; }
.doc li { margin: 3px 0; }
.doc li > p { margin: 0; }
.doc hr { border: 0; border-top: 1px solid var(--line); margin: 32px 0; }
.doc code { font: 400 .88em var(--font-mono); background: var(--mute-bg); padding: 1px 6px; border-radius: 4px; overflow-wrap: anywhere; }
.doc .lead { color: var(--muted); font-size: 18px; }
.tablewrap { overflow-x: auto; margin: 0 0 18px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.doc table { border-collapse: collapse; width: 100%; font-size: 14px; line-height: 1.5; }
.doc th { text-align: left; font: 600 12px var(--font-mono); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.doc td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.doc tr:last-child td { border-bottom: 0; }
.doc td code { white-space: nowrap; }
.tag { display: inline-block; font: 500 11px var(--font-mono); padding: 1px 8px; border-radius: 99px; white-space: nowrap; }
.tag.ok { background: var(--ok-bg); color: var(--ok); }
.tag.warn { background: var(--warn-bg); color: var(--warn); }
.tag.bad { background: var(--bad-bg); color: var(--bad); }
.tag.mute { background: var(--mute-bg); color: var(--muted); }

/* Código */
figure.code { margin: 0 0 18px; border-radius: 8px; overflow: hidden; background: var(--code-bg); border: 1px solid var(--code-line); }
figure.code .bar { display: flex; justify-content: space-between; align-items: center; background: var(--code-bar); padding: 4px 6px 4px 14px; border-bottom: 1px solid var(--code-line); }
figure.code .bar span { font: 500 11px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: #8aa095; }
figure.code .bar button { background: transparent; border: 0; color: #b9cdc3; font: 500 12px var(--font-mono); padding: 5px 10px; border-radius: 4px; cursor: pointer; }
figure.code .bar button:hover { background: #24342d; color: #fff; }
figure.code pre { margin: 0; padding: 14px 16px; overflow-x: auto; color: var(--code-ink); font: 400 13.5px/1.6 var(--font-mono); }
figure.code pre code { background: none; padding: 0; font: inherit; white-space: pre; overflow-wrap: normal; }
.hljs-keyword, .hljs-selector-tag, .hljs-built_in, .hljs-literal, .hljs-type { color: #ff9e7a; }
.hljs-string, .hljs-regexp, .hljs-addition { color: #a5e08a; }
.hljs-number, .hljs-symbol, .hljs-bullet { color: #e6c07b; }
.hljs-comment, .hljs-quote, .hljs-meta { color: #7f9288; font-style: italic; }
.hljs-title, .hljs-title.function_, .hljs-section { color: #7dc4ff; }
.hljs-attr, .hljs-attribute, .hljs-variable, .hljs-template-variable, .hljs-name { color: #c9adff; }
.hljs-deletion { color: #ff948c; }

/* Avisos */
.doc blockquote { margin: 0 0 18px; padding: 12px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); border-left: 4px solid var(--muted); }
.doc blockquote > :last-child { margin-bottom: 0; }
.doc blockquote.ojo { border-left-color: var(--warn); background: var(--warn-bg); }
.doc blockquote.ejercicio { border-left-color: var(--accent); background: var(--accent-soft); }
.doc blockquote.regla { border-left-color: var(--ok); background: var(--ok-bg); }
.doc blockquote.peligro { border-left-color: var(--bad); background: var(--bad-bg); }

.meta { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin: 0 0 20px; font: 400 12px var(--font-mono); color: var(--muted); }
.toc { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; }
.toc a { font-size: 13px; padding: 3px 10px; border: 1px solid var(--line); border-radius: 99px; text-decoration: none; color: var(--ink); background: var(--surface); }
.toc a:hover { border-color: var(--accent); }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.pager a { display: block; padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; text-decoration: none; color: var(--ink); background: var(--surface); min-width: 0; max-width: 100%; }
.pager a:hover { border-color: var(--accent); }
.pager small { display: block; font: 400 11px var(--font-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.stub { border: 1px dashed var(--line); border-radius: 10px; padding: 20px 22px; background: var(--surface); }
.stub ul { margin-bottom: 0; }
#toast { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 6px; font-size: 13px; z-index: 60; }

@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  #navbtn { display: inline-block; }
  .brand small { display: none; }
  .nav {
    position: fixed; z-index: 35; top: calc(var(--header-h) + env(safe-area-inset-top, 0px)); left: 0; bottom: 0; width: min(320px, 86vw);
    height: auto; background: var(--surface); border-right: 1px solid var(--line);
    padding: 20px 12px 40px max(16px, env(safe-area-inset-left, 0px));
    transform: translateX(-102%); visibility: hidden; transition: transform .18s ease, visibility .18s;
  }
  body.navopen .nav { transform: none; visibility: visible; }
  .main { padding-top: 24px; }
}
@media (prefers-reduced-motion: reduce) { .nav { transition: none; } }
</style>

<script>

const MANIFEST = [

];


const $ = (s) => document.querySelector(s);
const flat = () => MANIFEST.flatMap((g) => g.items);
const cache = new Map();
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const slug = (t) => t.toLowerCase().normalize('NFD').replace(/\p{M}/gu, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.id); toast.id = setTimeout(() => { t.hidden = true; }, 1400);
}

function buildNav() {
  $('#nav').innerHTML = MANIFEST.map((g) =>
    `<h3>${esc(g.title)}</h3>` + g.items.map((i) =>
      `<a href="#${i.id}" data-id="${i.id}" class="${i.file ? '' : 'todo'}"><span class="code">${i.code || ''}</span><span>${esc(i.title)}</span></a>`
    ).join('')
  ).join('');
}

async function loadDoc(file) {
  if (cache.has(file)) return cache.get(file);
  const r = await fetch('content/' + file);
  if (!r.ok) throw new Error('No se pudo cargar ' + file);
  const t = await r.text();
  cache.set(file, t);
  return t;
}

function enhance(root) {
  root.querySelectorAll('h2, h3').forEach((h) => { h.id = slug(h.textContent); });
  root.querySelectorAll('table').forEach((t) => {
    const w = document.createElement('div'); w.className = 'tablewrap'; t.replaceWith(w); w.append(t);
  });
  root.querySelectorAll('blockquote').forEach((b) => {
    const s = b.querySelector('strong'); if (!s) return;
    const k = slug(s.textContent);
    for (const name of ['ojo', 'ejercicio', 'regla', 'peligro']) if (k.startsWith(name)) b.classList.add(name);
  });
  root.querySelectorAll('pre > code').forEach((code) => {
    const pre = code.parentElement;
    let lang = ((code.className.match(/language-([\w+-]+)/) || [])[1]) || 'text';
    if (lang === 'console' || lang === 'shell') lang = 'bash';
    if (lang !== 'text' && window.hljs && hljs.getLanguage(lang)) { code.className = 'language-' + lang; try { hljs.highlightElement(code); } catch (e) { /* sin resaltado */ } }
    const fig = document.createElement('figure'); fig.className = 'code';
    const bar = document.createElement('div'); bar.className = 'bar';
    const label = document.createElement('span'); label.textContent = lang;
    const btn = document.createElement('button'); btn.type = 'button'; btn.textContent = 'Copiar';
    btn.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(code.textContent); toast('Copiado'); }
      catch (e) {
        const r = document.createRange(); r.selectNodeContents(code);
        const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Seleccionado: usa Ctrl+C');
      }
    });
    bar.append(label, btn); pre.replaceWith(fig); fig.append(bar, pre);
  });
}

function pager(id) {
  const list = flat().filter((i) => i.file);
  const k = list.findIndex((i) => i.id === id);
  if (k < 0) return '';
  const a = list[k - 1], b = list[k + 1];
  return `<div class="pager">${a ? `<a href="#${a.id}"><small>Anterior</small>${esc(a.title)}</a>` : '<span></span>'}${b ? `<a href="#${b.id}"><small>Siguiente</small>${esc(b.title)}</a>` : ''}</div>`;
}

async function show(id) {
  const item = flat().find((i) => i.id === id) || flat()[0];
  document.querySelectorAll('.nav a').forEach((a) => a.classList.toggle('on', a.dataset.id === item.id));
  const doc = $('#doc');
  document.title = item.title + ' · Biblioteca Técnica';
  if (!item.file) {
    doc.innerHTML = `<h1>${esc(item.title)}</h1><p class="meta"><span class="tag mute">pendiente</span><span>${item.code}</span></p>
      <div class="stub"><p><strong>Este módulo aún no está escrito.</strong> Alcance previsto:</p><ul>${item.note.map((n) => `<li>${esc(n)}</li>`).join('')}</ul></div>
      <p>Orden y dependencias en la <a href="#ruta">ruta de aprendizaje</a>.</p>`;
    return;
  }
  try {
    const md = await loadDoc(item.file);
    const box = document.createElement('div');
    box.innerHTML = marked.parse(md);
    enhance(box);
    const h2s = [...box.querySelectorAll('h2')];
    if (h2s.length > 2) {
      const toc = document.createElement('nav'); toc.className = 'toc'; toc.setAttribute('aria-label', 'En esta página');
      toc.innerHTML = h2s.map((h) => `<a href="#${h.id}" data-jump="${h.id}">${esc(h.textContent)}</a>`).join('');
      const h1 = box.querySelector('h1'); (h1 ? h1.nextElementSibling || h1 : box.firstChild).before(toc);
    }
    doc.innerHTML = ''; doc.append(...box.childNodes);
    doc.insertAdjacentHTML('beforeend', pager(item.id));
    doc.querySelectorAll('[data-jump]').forEach((a) => a.addEventListener('click', (e) => {
      e.preventDefault(); document.getElementById(a.dataset.jump).scrollIntoView({ behavior: reduced ? 'auto' : 'smooth' });
    }));
  } catch (e) {
    doc.innerHTML = `<h1>${esc(item.title)}</h1><blockquote class="peligro"><p><strong>Peligro:</strong> no se pudo cargar el contenido. Recarga la página.</p></blockquote>`;
  }
}

function route() {
  const id = decodeURIComponent(location.hash.slice(1)) || 'inicio';
  document.body.classList.remove('navopen');
  $('#results').hidden = true;
  if (!flat().some((i) => i.id === id)) {
    // No es un módulo: puede ser un ancla dentro de la página actual (p. ej. "receta-3")
    const doc = $('#doc');
    const target = doc.querySelector('#' + CSS.escape(id)) || doc.querySelector('[id^="' + id + '-"]');
    if (target) { target.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth' }); return; }
  }
  show(id).then(() => window.scrollTo(0, 0));
}

/* Búsqueda de texto completo sobre los módulos ya escritos */
let index = null;
async function ensureIndex() {
  if (index) return index;
  index = await Promise.all(flat().filter((i) => i.file).map(async (i) => ({ item: i, text: await loadDoc(i.file).catch(() => '') })));
  return index;
}
async function search(q) {
  const box = $('#results');
  q = q.trim().toLowerCase();
  if (q.length < 2) { box.hidden = true; return; }
  const terms = q.split(/\s+/);
  const idx = await ensureIndex();
  const hits = idx.filter((e) => { const hay = (e.item.title + ' ' + e.text).toLowerCase(); return terms.every((t) => hay.includes(t)); });
  const planned = flat().filter((i) => !i.file && (i.title + ' ' + i.note.join(' ')).toLowerCase().includes(q));
  const rows = hits.map((e) => {
    const low = e.text.toLowerCase(); const p = Math.max(0, low.indexOf(terms[0]));
    const snip = e.text.slice(Math.max(0, p - 50), p + 90).replace(/[#*`|>\n]+/g, ' ');
    return `<a href="#${e.item.id}"><b>${esc(e.item.title)}</b><span>…${esc(snip)}…</span></a>`;
  }).concat(planned.map((i) => `<a href="#${i.id}"><b>${esc(i.title)} <span class="tag mute" style="display:inline">pendiente</span></b></a>`));
  box.innerHTML = rows.length ? rows.join('') : '<p>Sin resultados.</p>';
  box.hidden = false;
}

$('#q').addEventListener('input', (e) => { clearTimeout(search.t); search.t = setTimeout(() => search(e.target.value), 120); });
document.addEventListener('click', (e) => { if (!e.target.closest('.search')) $('#results').hidden = true; });
$('#navbtn').addEventListener('click', () => document.body.classList.toggle('navopen'));
$('#theme').addEventListener('click', () => {
  const root = document.documentElement;
  const dark = root.dataset.theme === 'dark' || (!root.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('theme', root.dataset.theme); } catch (e) { /* sin almacenamiento */ }
});
try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) { /* sin almacenamiento */ }

buildNav();
addEventListener('hashchange', route);
route();
</script>
